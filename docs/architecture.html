<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>tuno · system architecture</title>
<style>
  body { margin:0; background:#fbfbf9; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  svg text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body>
<svg id="d" width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb" />
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e44" />
    </marker>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dcdde1" /></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#dots)" />
  <text x="40" y="56" font-size="34" font-weight="700" fill="#14161a">tuno · system architecture</text>
  <text x="40" y="84" font-size="16" fill="#6b7280">blue = plan / control path · green = live training telemetry · dashed = trust boundary</text>
  <g id="zones"></g>
  <g id="edges"></g>
  <g id="nodes"></g>
</svg>
<script>
const L = '../assets/logos/';
const zones = [
  {x:270, y:110, w:810, h:740, t:'Boat sandbox · vibetuner  (CPU control plane, secrets live here)', c:'#3b5bdb'},
  {x:1130, y:560, w:430, h:290, t:'JarvisLabs cloud  (rented GPU)', c:'#2f9e44'},
  {x:1130, y:110, w:430, h:430, t:'External APIs', c:'#868e96'},
];
const N = {
  user:   {x:40,  y:380, w:190, h:120, t:'Browser', s:['tuno mission control','web/index.html'], i:'💻'},
  api:    {x:300, y:150, w:330, h:110, t:'FastAPI · server.py :7861', s:['SSE /api/run · /api/approve','/api/live · /api/jobs · /api/dataset'], i:'⚡'},
  agent:  {x:300, y:300, w:330, h:190, t:'Agent pipeline · agent/*', s:['1 parse goal','2 recall memory  3 search','4 rerank  5 licence gate','6 ingest  7 price  8 quote'], i:'🧭'},
  relay:  {x:300, y:560, w:330, h:120, t:'Live relay · live_run.py', s:['warm-resume only · caps 20 min / ₹40','polls jl run logs every 15s','pause GPU in finally'], i:'🛰️'},
  ui2:    {x:300, y:720, w:330, h:100, t:'Jobs + receipts', s:['logs/live/jobs/*.json','loss & WER charts, history'], i:'📈'},
  cognee: {x:690, y:150, w:360, h:100, t:'Cognee', s:['cross-context memory','lessons from past runs (1.84×)'], img:'cognee.png'},
  jl:     {x:690, y:285, w:360, h:100, t:'jl CLI', s:['JarvisLabs API + SSH','resume · upload · run · pause'], img:'jarvislabs.png'},
  ab:     {x:690, y:420, w:360, h:110, t:'Airbyte (PyAirbyte OSS)', s:['source-file → DuckDB cache','HF manifest · GPU job logs'], img:'airbyte.png'},
  store:  {x:690, y:570, w:360, h:110, t:'Audit store', s:['runs · events · training_rows','SQLite today · SingleStore-ready'], img:'singlestore.png'},
  boat:   {x:690, y:720, w:360, h:100, t:'Boat', s:['persistent sandbox','public URL · no GPU on box'], img:'boat.png'},
  hf:     {x:1160, y:150, w:370, h:80, t:'Hugging Face', s:['ylacombe/expresso · CC BY-NC'], img:'huggingface.png'},
  ctx:    {x:1160, y:245, w:370, h:80, t:'context.dev', s:['web search for datasets'], img:'context.png'},
  sie:    {x:1160, y:340, w:370, h:80, t:'Superlinked SIE', s:['Qwen3-Reranker-0.6B scoring'], img:'superlinked.png'},
  amp:    {x:1160, y:435, w:370, h:80, t:'Amplitude', s:['HTTP v2 · live_train_step / epoch_eval'], img:'amplitude.png'},
  gpu:    {x:1160, y:600, w:370, h:220, t:'L4 GPU · train_m3.py', s:['whisper-small + LoRA r=8','Seq2SeqTrainer · 3 epochs','logs loss / 10 steps, WER / epoch','best checkpoint kept','WER 7.83% → 6.95% · $0.05'], img:'jarvislabs.png'},
};
const E = [
  ['user','api','SSE stream','r','l','a'],
  ['api','agent','','b','t','a'],
  ['agent','cognee','recall','r','l','a'],
  ['agent','jl','live L4 price','r','l','a'],
  ['agent','ab','ingest','r','l','a'],
  ['agent','ctx','search','t','l','a', [[465,280],[1100,280],[1100,285]]],
  ['agent','sie','rerank','r','l','a', [[660,330],[660,272],[1110,272],[1110,380]]],
  ['hf','ab','manifest','l','r','a', [[1090,190],[1090,460]]],
  ['api','relay','dispatch','l','l','a', [[285,205],[285,620]]],
  ['relay','jl','resume · run','r','b','a', [[870,600],[870,385]]],
  ['jl','gpu','SSH','r','l','a', [[1110,335],[1110,700]]],
  ['gpu','relay','jl run logs / 15s','l','r','g', [[1120,760],[660,760],[660,650]]],
  ['relay','store','points','r','l','g'],
  ['relay','amp','events','r','l','g', [[1095,610],[1095,475]]],
  ['ab','store','rows','b','t','g'],
  ['relay','ui2','job record','b','t','g'],
  ['store','api','reads','t','r','a', [[1065,600],[1065,205]]],
];
const svg = document.getElementById('d'), NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; (parent||svg).appendChild(e); return e; };
const zg = document.getElementById('zones'), eg = document.getElementById('edges'), ng = document.getElementById('nodes');
for (const z of zones) {
  el('rect', {x:z.x, y:z.y, width:z.w, height:z.h, rx:20, fill:'#ffffff', 'fill-opacity':0.6, stroke:z.c, 'stroke-width':1.6, 'stroke-dasharray':'7 6'}, zg);
  el('text', {x:z.x+16, y:z.y+24, 'font-size':13, 'font-weight':600, fill:z.c, 'letter-spacing':0.5}, zg, z.t.toUpperCase());
}
const anchor = (n, side) => ({l:[n.x, n.y+n.h/2], r:[n.x+n.w, n.y+n.h/2], t:[n.x+n.w/2, n.y], b:[n.x+n.w/2, n.y+n.h]})[side];
for (const [f, t, label, sf, st, kind, via] of E) {
  const a = anchor(N[f], sf), b = anchor(N[t], st);
  const pts = [a, ...(via||[]), b];
  const col = kind === 'g' ? '#2f9e44' : '#3b5bdb';
  el('polyline', {points: pts.map(p=>p.join(',')).join(' '), fill:'none', stroke:col, 'stroke-width':1.8, 'marker-end':`url(#${kind})`, 'stroke-linejoin':'round', opacity:0.85}, eg);
  if (label) {
    let best = [pts[0], pts[1]], len = 0;
    for (let i = 0; i < pts.length-1; i++) { const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); if (d > len) { len = d; best = [pts[i], pts[i+1]]; } }
    const mx = (best[0][0]+best[1][0])/2, my = (best[0][1]+best[1][1])/2;
    const w = label.length*6.6+14;
    el('rect', {x:mx-w/2, y:my-10, width:w, height:20, rx:10, fill:'#fff', stroke:col, 'stroke-width':1}, eg);
    el('text', {x:mx, y:my+4, 'font-size':11.5, 'text-anchor':'middle', fill:col, 'font-weight':600}, eg, label);
  }
}
for (const k in N) {
  const n = N[k];
  el('rect', {x:n.x, y:n.y, width:n.w, height:n.h, rx:14, fill:'#ffffff', stroke:'#cfd2d8', 'stroke-width':1.4}, ng);
  if (n.img) el('image', {href:L+n.img, x:n.x+12, y:n.y+12, width:34, height:34}, ng);
  else el('text', {x:n.x+14, y:n.y+38, 'font-size':26}, ng, n.i);
  el('text', {x:n.x+56, y:n.y+28, 'font-size':16, 'font-weight':700, fill:'#14161a'}, ng, n.t);
  n.s.forEach((s, i) => el('text', {x:n.x+56, y:n.y+50+i*19, 'font-size':13, fill:'#5c6370'}, ng, s));
}
</script>
</body>
</html>
